apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aios-manager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: aios-manager
  policyTypes:
    - Egress
    - Ingress
  ingress:
    - from: []
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0 # TODO: restrict to GitHub, Infisical, Bifrost, Loki
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
