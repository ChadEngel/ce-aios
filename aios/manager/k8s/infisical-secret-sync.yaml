# InfisicalSecret sync for aios-manager
# Secrets live in Infisical project caehomelab-v1q6 / prod at path "/"
# Infisical keys:
#   aios-manager/GITHUB_APP_ID
#   aios-manager/GITHUB_APP_PRIVATE_KEY
#   aios-manager/GITHUB_REPO
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: aios-manager-secrets-sync
  namespace: ai
spec:
  hostAPI: https://secrets.caehomelab.com/api
  resyncInterval: 60
  authentication:
    universalAuth:
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: ai
      secretsScope:
        projectSlug: caehomelab-v1q6
        envSlug: prod
        secretsPath: "/"
        recursive: false
  managedKubeSecretReferences:
    - secretName: aios-manager-secrets
      secretNamespace: ai
      creationPolicy: Owner
      template:
        data:
          GITHUB_APP_ID: "{{ .aios-manager/GITHUB_APP_ID.Value }}"
          GITHUB_APP_PRIVATE_KEY: "{{ .aios-manager/GITHUB_APP_PRIVATE_KEY.Value }}"
          GITHUB_REPO: "{{ .aios-manager/GITHUB_REPO.Value }}"
