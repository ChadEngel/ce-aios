# InfisicalSecret sync for aios-manager
#
# Sources secrets from the jarvis-jatg Infisical project (the AIOS / agent
# project), NOT from the lab project (caehomelab-v1q6). Boundary rationale:
#   - caehomelab-v1q6 = infrastructure (Traefik, Grafana, Infisical itself, etc.)
#   - jarvis-jatg     = AIOS / agents (this App, future agent creds, Bifrost VKs, etc.)
# Mixing the two was tried and rejected — see issue #43.
#
# Secrets live in Infisical project jarvis-jatg / prod at the root path "/".
# Infisical keys (all at root, hyphen-free so the operator template parser accepts them):
#   GITHUB_APP_ID
#   GITHUB_APP_PRIVATE_KEY
#   GITHUB_REPO
#
# Operator template syntax note: the infisical-operator's Go-template-based
# template language rejects hyphens in path segments (bad character U+002D '-',
# see issue #43). Putting the secrets at the root path avoids the hyphen
# problem entirely and keeps the template readable.
#
# Authentication: a SEPARATE K8s Secret in ns ai (jarvis-jatg-universal-auth)
# holds a Universal-Auth clientId+clientSecret that is bound to the
# jarvis-jatg project specifically. This is per the operator model — one
# Secret per (project, scope) tuple. Universal-Auth credentials are per-project;
# the existing infisical-universal-auth Secret in ns ai only has access to
# caehomelab-v1q6 and is used by the other 8 InfisicalSecret resources.
#
# To create the jarvis-jatg-universal-auth Secret (human-executed):
#   1. Infisical UI -> Organization Settings -> Machine Identities
#   2. Open the jarvis-jatg identity (or create one) -> "Universal Auth" tab
#   3. Add a configuration scoped to project=jarvis-jatg, env=prod, role=read-only
#   4. Copy the generated clientId + clientSecret
#   5. On util-server:
#        kubectl -n ai create secret generic jarvis-jatg-universal-auth \
#          --type=Opaque \
#          --from-literal=clientId=<clientId> \
#          --from-literal=clientSecret=<clientSecret>
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: aios-manager-secrets-sync
  namespace: ai
  labels:
    app.kubernetes.io/name: aios-manager
    app.kubernetes.io/part-of: aios
spec:
  hostAPI: https://secrets.caehomelab.com/api
  resyncInterval: 60
  authentication:
    universalAuth:
      credentialsRef:
        secretName: jarvis-jatg-universal-auth
        secretNamespace: ai
      secretsScope:
        projectSlug: jarvis-jatg
        envSlug: prod
        secretsPath: "/"
        recursive: false
  managedKubeSecretReferences:
    - secretName: aios-manager-secrets
      secretNamespace: ai
      creationPolicy: Owner
      secretType: Opaque
      template:
        data:
          GITHUB_APP_ID: "{{ .GITHUB_APP_ID.Value }}"
          GITHUB_APP_PRIVATE_KEY: "{{ .GITHUB_APP_PRIVATE_KEY.Value }}"
          # Container env stays GITHUB_REPO (what aios_manager.py reads); the
          # Infisical key is GITHUB_APP_REPO (verified 2026-10-16 — a plain
          # GITHUB_REPO key does NOT exist in the project; sync would fail
          # silently rendering empty without this mapping).
          GITHUB_REPO: "{{ .GITHUB_APP_REPO.Value }}"
