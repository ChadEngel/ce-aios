apiVersion: apps/v1
kind: Deployment
metadata:
  name: aios-manager
  labels:
    app.kubernetes.io/name: aios-manager
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: aios-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aios-manager
    spec:
      containers:
        - name: manager
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["python", "-c", "import time; print('aios-manager skeleton'); time.sleep(86400)"]
          env:
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: aios-manager-secrets
                  key: GITHUB_APP_ID
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: aios-manager-secrets
                  key: GITHUB_APP_PRIVATE_KEY
            - name: GITHUB_REPO
              valueFrom:
                secretKeyRef:
                  name: aios-manager-secrets
                  key: GITHUB_REPO
            - name: BIFROST_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bifrost-secrets
                  key: BIFROST_API_KEY
            - name: BIFROST_BASE_URL
              value: https://llm.caehomelab.com/v1
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          # Logging to Loki via stdout
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: aios-manager
spec:
  selector:
    app.kubernetes.io/name: aios-manager
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
