# Digest job has its own InfisicalSecret (not the manager's sync): the digest
# owns its secret surface and adds two Bifrost VK keys, which the manager does
# not need. Same Infisical project (jarvis-jatg, prod, root path) and the same
# jarvis-jatg-universal-auth credential as aios-manager-secrets-sync --
# universal-auth is read-only and per-project, two syncs may share it.
#
# Infisical keys (root path, hyphen-free names):
#   GITHUB_APP_ID, GITHUB_APP_PRIVATE_KEY, GITHUB_APP_REPO,
#   BIFROST_VK_AIOS_HELPDESK       (read compartment, R0 — unchanged)
#   BIFROST_VK_AIOS_HELPDESK_FILE  (file compartment, R2 — move/delete/folder)
# The FILE VK's execute list is exactly create-mail-folder, move-mail-message,
# delete-mail-message, list-mail-folders, list-mail-folder-messages.
# NOTE the manager sync maps Infisical GITHUB_APP_REPO -> container env
# GITHUB_REPO; this sync keeps container env == Infisical key names, which
# digest.py reads directly.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: aios-mail-digest-secrets-sync
  namespace: ai
  labels:
    app.kubernetes.io/name: aios-mail-digest
    app.kubernetes.io/part-of: aios
spec:
  hostAPI: https://secrets.caehomelab.com/api
  resyncInterval: 60
  authentication:
    universalAuth:
      credentialsRef:
        secretName: jarvis-jatg-universal-auth
        secretNamespace: ai
      secretsScope:
        projectSlug: jarvis-jatg
        envSlug: prod
        secretsPath: "/"
        recursive: false
  managedKubeSecretReferences:
    - secretName: aios-mail-digest-secrets
      secretNamespace: ai
      creationPolicy: Owner
      secretType: Opaque
      template:
        data:
          GITHUB_APP_ID: "{{ .GITHUB_APP_ID.Value }}"
          GITHUB_APP_PRIVATE_KEY: "{{ .GITHUB_APP_PRIVATE_KEY.Value }}"
          GITHUB_APP_REPO: "{{ .GITHUB_APP_REPO.Value }}"
          BIFROST_VK_AIOS_HELPDESK: "{{ .BIFROST_VK_AIOS_HELPDESK.Value }}"
          BIFROST_VK_AIOS_HELPDESK_FILE: "{{ .BIFROST_VK_AIOS_HELPDESK_FILE.Value }}"