# Three fires daily (Chad, 2026-10-16): morning, midday, evening. timeZone
# avoids DST wobble (requires k8s >= 1.27; fine on this k3s). The job reads its
# own comments on the digest issue as a seen-ledger: 'other' tier reports once,
# priority re-alerts while unread, and a fire with nothing new posts nothing.
#
# nodeSelector pins to the amd64 workers (caelx002/caelx003) because the image
# is node-locally imported (`imagePullPolicy: Never`) and both workers carry it.
# Import the same tag on BOTH workers so the digest still runs if one dies.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: aios-mail-digest
  namespace: ai
  labels:
    app.kubernetes.io/name: aios-mail-digest
    app.kubernetes.io/part-of: aios
spec:
  schedule: "0 5,12,17 * * *"
  timeZone: America/Chicago
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 259200
      template:
        metadata:
          labels:
            app: aios-mail-digest
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/arch: amd64
          containers:
            - name: digest
              image: caehomelab/aios-mail-digest:0.5.6
              imagePullPolicy: Never
              envFrom:
                - secretRef:
                    name: aios-mail-digest-secrets
                - configMapRef:
                    name: aios-mail-rules
              env:
                - name: BIFROST_URL
                  value: "https://llm.caehomelab.com"
                # Shared RWX ledger: the digest READS what the filer recorded
                # (0.4.0). Without this mount the digest cannot see mail the
                # filer already moved and would report nothing new.
                - name: DIGEST_STATE_DIR
                  value: "/state"
                - name: DIGEST_ISSUE_NUMBER
                  value: "50"
                - name: GITHUB_INSTALLATION_ID
                  value: "168700840"
              volumeMounts:
                # The digest writes to the ledger too (marks rows reported +
                # advances the report cursor), so this is read-write.
                - name: state
                  mountPath: /state
                  readOnly: false
              resources:
                requests:
                  memory: 64Mi
                  cpu: 25m
                limits:
                  memory: 256Mi
                  cpu: 250m
              securityContext:
                runAsNonRoot: true
                runAsUser: 65534
                runAsGroup: 65534
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                seccompProfile:
                  type: RuntimeDefault
          volumes:
            - name: state
              persistentVolumeClaim:
                claimName: aios-mail-state