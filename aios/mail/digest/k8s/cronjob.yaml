# R0 daily mail digest. 07:00 America/Chicago every day (timeZone field avoids
# DST wobble; requires k8s >= 1.27, fine on this k3s).
#
# nodeSelector pins to the amd64 workers (caelx002/caelx003) because the image
# is node-locally imported (`imagePullPolicy: Never`) and both workers carry it.
# Import the same tag on BOTH workers so the digest still runs if one dies.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: aios-mail-digest
  namespace: ai
  labels:
    app.kubernetes.io/name: aios-mail-digest
    app.kubernetes.io/part-of: aios
spec:
  schedule: "0 7 * * *"
  timeZone: America/Chicago
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 259200
      template:
        metadata:
          labels:
            app: aios-mail-digest
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/arch: amd64
          containers:
            - name: digest
              image: caehomelab/aios-mail-digest:0.1.3
              imagePullPolicy: Never
              envFrom:
                - secretRef:
                    name: aios-mail-digest-secrets
              env:
                - name: BIFROST_URL
                  value: "https://llm.caehomelab.com"
                - name: DIGEST_ISSUE_NUMBER
                  value: "50"
                - name: GITHUB_INSTALLATION_ID
                  value: "168700840"
                - name: DIGEST_MODEL
                  value: "ollama/muse-glimmer:latest"
              resources:
                requests:
                  memory: 64Mi
                  cpu: 25m
                limits:
                  memory: 256Mi
                  cpu: 250m
              securityContext:
                runAsNonRoot: true
                runAsUser: 65534
                runAsGroup: 65534
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                seccompProfile:
                  type: RuntimeDefault