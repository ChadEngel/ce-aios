# Three fires daily (Chad, 2026-10-16): morning, midday, evening. timeZone
# avoids DST wobble (requires k8s >= 1.27; fine on this k3s). The job reads its
# own comments on the digest issue as a seen-ledger: 'other' tier reports once,
# priority re-alerts while unread, and a fire with nothing new posts nothing.
#
# nodeSelector pins to the amd64 workers (caelx002/caelx003) because the image
# is node-locally imported (`imagePullPolicy: Never`) and both workers carry it.
# Import the same tag on BOTH workers so the digest still runs if one dies.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: aios-mail-digest
  namespace: ai
  labels:
    app.kubernetes.io/name: aios-mail-digest
    app.kubernetes.io/part-of: aios
spec:
  schedule: "0 5,12,17 * * *"
  timeZone: America/Chicago
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 259200
      template:
        metadata:
          labels:
            app: aios-mail-digest
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/arch: amd64
          containers:
            - name: digest
              image: caehomelab/aios-mail-digest:0.3.3
              imagePullPolicy: Never
              envFrom:
                - secretRef:
                    name: aios-mail-digest-secrets
              env:
                - name: BIFROST_URL
                  value: "https://llm.caehomelab.com"
                - name: DIGEST_ISSUE_NUMBER
                  value: "50"
                - name: GITHUB_INSTALLATION_ID
                  value: "168700840"
                - name: DIGEST_MODEL
                  value: "ollama/muse-glimmer:latest"
                # Chad's priority tiers (editable without a rebuild; code has
                # the same default). Comma-separated, lowercase, substring
                # match on sender name + address + subject only.
                - name: DIGEST_PRIORITY_KEYWORDS
                  value: "bluff creek,ccha,crossbar,bearpath,flag football,cc united"
                # Protected senders (Chad, 2026-10-17): never filed, never
                # deleted — family/personal domains stay in the inbox. The
                # sent-contacts tier is protected by design. 2026-10-18: +
                # warnersstellian.com (Chad, active fridge purchase — order/
                # delivery/service mail must stay visible until resolved).
                - name: DIGEST_PROTECTED_DOMAINS
                  value: "engelmn.com,alohamn.com,crookedgate.com,warnersstellian.com,warners-stellian.com"
                - name: DIGEST_SENT_TOP
                  # 250: Chad's mail rule protects "anything from a contact";
                  # a 50-address lookback missed bulk-keep senders (club,
                  # alerts) during the 2026-10-17 inbox sweep (76 addresses).
                  value: "250"
                # Filing tier (Chad, 2026-10-17): folder names + retention +
                # scan window. Pattern lists are env-tunable regex fragments
                # (subject + sender-name match). All defaults also live in
                # digest.py, so any of these can be dropped to fall back.
                - name: DIGEST_ORDERS_FOLDER
                  value: "Orders"
                - name: DIGEST_RECEIPTS_FOLDER
                  value: "Receipts"
                - name: DIGEST_FILED_FOLDER
                  value: "AIOS-Filed"
                - name: DIGEST_FILED_DAYS
                  value: "10"
                - name: DIGEST_SCAN_TOP
                  # 2026-10-18: 50 → 200. At 50/fire the digest only ever saw
                  # the newest 50 inbox items — anything buried deeper was
                  # never listed, never reported (grace), never filed, so the
                  # backlog ground at ~21/fire. 200 + SCAN_TOP=500 one-off
                  # catch-up clears it while grace protection still applies.
                  value: "200"
              resources:
                requests:
                  memory: 64Mi
                  cpu: 25m
                limits:
                  memory: 256Mi
                  cpu: 250m
              securityContext:
                runAsNonRoot: true
                runAsUser: 65534
                runAsGroup: 65534
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                seccompProfile:
                  type: RuntimeDefault