# AIOS Inbox Console — READ-ONLY (0.6.2).
# One box = one mailbox (D4): this service mounts the SAME /state PVC as the
# digest/filer legs, but READ-ONLY — a bug here cannot corrupt the ledger,
# and no endpoint in the image writes to disk at all.
# Auth: HTTP Basic over LAN; password lives in secret aios-console-auth
# (create it once: kubectl -n ai create secret generic aios-console-auth
#  --from-literal=password='...').
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aios-console
  labels:
    app: aios-mail-console
    app.kubernetes.io/part-of: aios
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aios-console-ReadOnly
  labels:
    app.kubernetes.io/part-of: aios
rules:
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [get, list]        # strictly read-only: fire status only
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aios-console-ReadOnly
  labels:
    app.kubernetes.io/part-of: aios
subjects:
  - kind: ServiceAccount
    name: aios-console
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aios-console-ReadOnly
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aios-console
  labels:
    app: aios-mail-console
    app.kubernetes.io/name: aios-inbox-console
    app.kubernetes.io/part-of: aios
spec:
  replicas: 1
  strategy:
    type: Recreate            # single PVC mount reader
  selector:
    matchLabels:
      app: aios-mail-console
  template:
    metadata:
      labels:
        app: aios-mail-console
        app.kubernetes.io/name: aios-inbox-console
        app.kubernetes.io/part-of: aios
    spec:
      serviceAccountName: aios-console
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: console
          image: caehomelab/aios-mail-console:0.6.2
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                # live rule values + model — the identical object the digest
                # and filer legs envFrom (one config version across legs)
                name: aios-mail-rules
          env:
            - name: CONSOLE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aios-console-auth
                  key: password
            - name: CONSOLE_K8S_NS
              value: ai
            - name: CONSOLE_K8S_URL
              # k3s API endpoint (svc/kubernetes :443 refuses from pods on
              # workers; the server node answers directly)
              value: https://192.168.30.217:6443
          resources:
            requests: {memory: 96Mi, cpu: 50m}
            limits: {memory: 256Mi, cpu: 500m}
          volumeMounts:
            - name: state
              mountPath: /state
              readOnly: true   # load-bearing: no write path, ever
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: aios-mail-state
---
apiVersion: v1
kind: Service
metadata:
  name: aios-console
  labels:
    app: aios-mail-console
    app.kubernetes.io/part-of: aios
spec:
  type: NodePort
  selector:
    app: aios-mail-console
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080        # LAN: http://<node>:30080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aios-console-netpol
  labels:
    app.kubernetes.io/name: aios-inbox-console
    app.kubernetes.io/part-of: aios
spec:
  podSelector:
    matchLabels:
      app: aios-mail-console
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - ipBlock: {cidr: 192.168.0.0/16}   # the home LAN
        - ipBlock: {cidr: 10.42.0.0/16}     # cluster pod net ( probes)
        - ipBlock: {cidr: 10.43.0.0/16}     # cluster svc net
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:                                   # kube-dns
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:                                   # k8s API (fire status) + future
        - ipBlock: {cidr: 0.0.0.0/0}
      ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 6443}