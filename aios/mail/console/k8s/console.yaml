# AIOS Inbox Console — read-only ledger + the config write path (0.6.3).
# One box = one mailbox (D4): this service mounts the SAME /state PVC as the
# digest/filer legs but with TWO mounts:
#   /state  READ-ONLY  — the ledger. A bug here can never corrupt it.
#   /config READ-WRITE — the config store SUBDIRECTORY only (step 5: the
#                        console's sole write path; config.yaml + journal).
# The mount boundary is the safety argument: the ledger is not merely
# "not written" by this app, it is unwritable to it.
# Auth: HTTP Basic over LAN; password lives in secret aios-console-auth
# (create it once: kubectl -n ai create secret generic aios-console-auth
#  --from-literal=password='...').
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aios-console
  labels:
    app: aios-mail-console
    app.kubernetes.io/part-of: aios
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aios-console-ReadOnly
  labels:
    app.kubernetes.io/part-of: aios
rules:
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [get, list]        # strictly read-only: fire status only
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aios-console-ReadOnly
  labels:
    app.kubernetes.io/part-of: aios
subjects:
  - kind: ServiceAccount
    name: aios-console
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aios-console-ReadOnly
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aios-console
  labels:
    app: aios-mail-console
    app.kubernetes.io/name: aios-inbox-console
    app.kubernetes.io/part-of: aios
spec:
  replicas: 1
  strategy:
    type: Recreate            # single PVC mount reader
  selector:
    matchLabels:
      app: aios-mail-console
  template:
    metadata:
      labels:
        app: aios-mail-console
        app.kubernetes.io/name: aios-inbox-console
        app.kubernetes.io/part-of: aios
    spec:
      serviceAccountName: aios-console
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: console
          image: caehomelab/aios-mail-console:0.6.4
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                # live rule values + model — the identical object the digest
                # and filer legs envFrom (one config version across legs)
                name: aios-mail-rules
          env:
            - name: CONSOLE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aios-console-auth
                  key: password
            - name: CONSOLE_K8S_NS
              value: ai
            - name: CONSOLE_K8S_URL
              # k3s API endpoint (svc/kubernetes :443 refuses from pods on
              # workers; the server node answers directly)
              value: https://192.168.30.217:6443
            # STEP 5 — the config store lives in a SUBDIRECTORY mounted
            # read-write here. The ledger's /state mount stays READ-ONLY, so a
            # console bug can write config but is structurally unable to open
            # ledger.jsonl for writing (proven: root RO denies it, this subPath
            # allows only the subdir).
            - name: DIGEST_CONFIG_DIR
              value: /config
            # Actor recorded in the D5 journal for console saves.
            - name: CONSOLE_ACTOR
              value: console:chad
          resources:
            requests: {memory: 96Mi, cpu: 50m}
            limits: {memory: 256Mi, cpu: 500m}
          securityContext:
            # Non-root, matching the digest/filer legs. Load-bearing for step 5:
            # the config files this writes must be mutually readable by the
            # legs that consume them (same uid + save() writes 0644).
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: state
              mountPath: /state
              readOnly: true   # load-bearing: the LEDGER is never writable here
            # The config store subdir, mounted SEPARATELY read-write. The ONLY
            # writable path in this pod: config.yaml + its journal live here,
            # isolated from the ledger by the mount boundary itself.
            - name: state
              mountPath: /config
              subPath: config
              readOnly: false
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: aios-mail-state
---
apiVersion: v1
kind: Service
metadata:
  name: aios-console
  labels:
    app: aios-mail-console
    app.kubernetes.io/part-of: aios
spec:
  type: NodePort
  selector:
    app: aios-mail-console
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080        # LAN: http://<node>:30080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aios-console-netpol
  labels:
    app.kubernetes.io/name: aios-inbox-console
    app.kubernetes.io/part-of: aios
spec:
  podSelector:
    matchLabels:
      app: aios-mail-console
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - ipBlock: {cidr: 192.168.0.0/16}   # the home LAN
        - ipBlock: {cidr: 10.42.0.0/16}     # cluster pod net ( probes)
        - ipBlock: {cidr: 10.43.0.0/16}     # cluster svc net
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:                                   # kube-dns
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:                                   # k8s API (fire status) + future
        - ipBlock: {cidr: 0.0.0.0/0}
      ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 6443}