# InfisicalSecret sync for the inbox console's HTTP Basic password.
#
# WHY: aios-console-auth was created BY HAND on 2026-10-21
#   kubectl -n ai create secret generic aios-console-auth --from-literal=password=...
# and never came under Infisical. Every other credential in ns ai is synced
# (9 other InfisicalSecret objects), so this was the one hand-placed secret with
# no rotation path and no source of truth outside the cluster. This manifest
# closes that gap.
#
# Same project/credential as the digest + manager syncs: Infisical project
# `jarvis-jatg`, env `prod`, root path `/`; authentication via the
# jarvis-jatg-universal-auth Secret (universal-auth is read-only and
# per-project, so multiple syncs may share it).
#
# Infisical key (root path, hyphen-free — the operator template parser rejects
# hyphens in path segments, see issue #43):
#   CONSOLE_PASSWORD
#
# Container env stays CONSOLE_PASSWORD and the k8s Secret key stays `password`
# (what console.yaml's secretKeyRef reads), so this change does NOT touch the
# Deployment. Infisical key name == container env name, matching the digest
# sync's convention.
#
# ─────────────────────────────────────────────────────────────────────────────
# ORDERING IS LOAD-BEARING — DO NOT APPLY THIS BEFORE THE KEY EXISTS.
# The console FAILS OPEN: console.py's require_auth() returns immediately when
# CONSOLE_PASSWORD is empty, so a sync that renders an empty value would leave
# the console UNAUTHENTICATED on the LAN. The operator renders missing keys as
# empty strings silently (documented in aios/manager/k8s/infisical-secret-sync.yaml).
#
# Correct order (VERIFIED 2026-10-27 against operator v0.10.34):
#   1. Add key CONSOLE_PASSWORD to Infisical jarvis-jatg / prod / "/" with the
#      CURRENT cluster value (rotation is a separate, later step):
#        kubectl -n ai get secret aios-console-auth -o jsonpath='{.data.password}' | base64 -d
#   2. Verify it reads back non-empty (UI, or the read-only universal-auth
#      identity via /api/v3/secrets/raw/CONSOLE_PASSWORD).
#   3. If a hand-made Secret of this name already exists, delete BOTH it and
#      any prior InfisicalSecret, then apply:
#        kubectl -n ai delete secret aios-console-auth --ignore-not-found
#        kubectl -n ai delete infisicalsecret aios-console-auth-sync --ignore-not-found
#        kubectl kustomize aios/mail/console/k8s | kubectl apply -f -
#   4. Confirm the Secret reappears within ~60s with an ownerReference to
#      aios-console-auth-sync and a NON-EMPTY password.
#   5. Confirm HTTP Basic still gates the console (curl without creds -> 401).
#
# ROTATION IS NOT RESTART-FREE (measured 2026-10-27):
#   Changing CONSOLE_PASSWORD in Infisical updates this Secret in ~15s, but the
#   console does NOT pick it up on its own. console.py binds the password once
#   at process start and the Deployment injects it via secretKeyRef env, so the
#   running pod keeps the old value. Rotation = change key, wait for sync, then
#       kubectl -n ai rollout restart deploy/aios-console
#   Verified: after a rotation the live console still accepted the OLD password
#   (200) and rejected the NEW one (401) until restarted. The operator's
#   auto-redeploy does not cover this Deployment (AutoRedeployReady = "0
#   deployments"), and the secrets.infisical.com/auto-reload annotation had no
#   effect when tried.
#
# WHY STEP 3 DELETES BOTH (learned the hard way 2026-10-27):
#   Deleting only the Secret does NOT make the operator recreate it. The
#   operator short-circuits on the Infisical server ETag — when the remote
#   content is unchanged it logs "Secrets unchanged (server ETag match),
#   skipping reconciliation" and never rewrites the Secret. Applying the same
#   InfisicalSecret again does not help either (same cached ETag). Only a NEW
#   InfisicalSecret object forces a fresh reconcile that re-creates the Secret
#   and adopts it with ownerReference + controller=true.
#   Consequence: do not "delete the Secret to test the sync" — that leaves the
#   console without a Secret until a fresh InfisicalSecret is applied. The
#   running pod keeps its old env (no restart), so it keeps serving, but a pod
#   restart in that window would leave the console unable to start.
#   NOTE: the `secrets.infisical.com/force-sync` annotation is NOT a real
#   operator feature — it does nothing. Do not reach for it.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: aios-console-auth-sync
  namespace: ai
  labels:
    app.kubernetes.io/name: aios-console
    app.kubernetes.io/part-of: aios
spec:
  hostAPI: https://secrets.caehomelab.com/api
  resyncInterval: 60
  authentication:
    universalAuth:
      credentialsRef:
        secretName: jarvis-jatg-universal-auth
        secretNamespace: ai
      secretsScope:
        projectSlug: jarvis-jatg
        envSlug: prod
        secretsPath: "/"
        recursive: false
  managedKubeSecretReferences:
    - secretName: aios-console-auth
      secretNamespace: ai
      creationPolicy: Owner
      secretType: Opaque
      template:
        data:
          # k8s Secret key `password` (read by console.yaml secretKeyRef)
          # sourced from the Infisical key CONSOLE_PASSWORD.
          password: "{{ .CONSOLE_PASSWORD.Value }}"
