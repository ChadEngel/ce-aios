apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai
resources:
  - infisical-secret-sync.yaml
  - console.yaml
# NOTE: envFrom references ConfigMap aios-mail-rules by NAME; that object is
# owned/deployed by ../digest/k8s (rule identity across legs lives THERE —
# do not fork a copy here).
#
# NOTE: infisical-secret-sync.yaml must be applied ONLY after the Infisical key
# CONSOLE_PASSWORD exists — the console fails OPEN on an empty password. See
# the ordering block at the top of that file.
