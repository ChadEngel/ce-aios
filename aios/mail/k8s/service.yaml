apiVersion: v1
kind: Service
metadata:
  name: aios-mail-mcp
  namespace: ai
spec:
  type: ClusterIP
  selector:
    app: aios-mail-mcp
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http

---
# Token cache for the device-code login (encrypted envelope + its key file
# live in the container's config dir). Node-bound local-path, Delete-reclaim:
# losing it costs ONE re-login (device code), not data. Bifrost PVC precedent.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aios-mail-cache
  namespace: ai
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 64Mi