# Renders Secret `aios-noc-secrets` (ns ai) for the NOC sweep.
#
# ORDERING: BIFROST_VK_AIOS_NOC must exist in Infisical (jarvis-jatg / prod /
# "/") BEFORE this is applied. The VK value is auto-generated by Bifrost and
# currently lives only in `config.db` — which does NOT survive a PVC rebuild.
# Putting it here is what makes the NOC hire declarative and recoverable; the
# helpdesk VKs are already stored this way (BIFROST_VK_AIOS_HELPDESK*).
#
# To read the current value out of the running gateway:
#   kubectl -n ai cp <bifrost-pod>:/app/data/config.db /tmp/config.db
#   sqlite3 /tmp/config.db "SELECT name,value FROM governance_virtual_keys;"
#
# NOTE: the operator short-circuits on an unchanged Infisical ETag. If a Secret
# of this name already exists by hand, delete BOTH it and any prior
# InfisicalSecret before applying, or the operator will not adopt it.
# See aios/mail/console/k8s/infisical-secret-sync.yaml for the full trap.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: aios-noc-secrets-sync
  namespace: ai
  labels:
    app.kubernetes.io/name: aios-noc
    app.kubernetes.io/part-of: aios
spec:
  hostAPI: https://secrets.caehomelab.com/api
  authentication:
    universalAuth:
      credentialsRef:
        secretName: jarvis-jatg-universal-auth
        secretNamespace: ai
      secretsScope:
        projectSlug: jarvis-jatg
        envSlug: prod
        secretsPath: "/"
        recursive: false
  managedKubeSecretReferences:
    - secretName: aios-noc-secrets
      secretNamespace: ai
      secretType: Opaque
      creationPolicy: Owner
      template:
        data:
          BIFROST_VK_AIOS_NOC: "{{ .BIFROST_VK_AIOS_NOC.Value }}"
          GITHUB_APP_ID: "{{ .GITHUB_APP_ID.Value }}"
          GITHUB_APP_PRIVATE_KEY: "{{ .GITHUB_APP_PRIVATE_KEY.Value }}"
          GITHUB_APP_REPO: "{{ .GITHUB_APP_REPO.Value }}"
  resyncInterval: 60
