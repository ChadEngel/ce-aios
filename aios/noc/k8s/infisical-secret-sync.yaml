# AIOS NOC secrets — Infisical -> K8s Secret sync.
#
# Pulls the NOC's credentials from the `jarvis-jatg` Infisical project (the
# agent project — NOT caehomelab-v1q6, the infrastructure project) into a K8s
# Secret the CronJob envFrom's. Same pattern as aios/manager/, same
# Universal-Auth machine identity (jarvis-jatg-universal-auth, created once by
# hand).
#
# Keys synced (all four REQUIRED by noc.py):
#   BIFROST_VK_AIOS_NOC     — the read-only Virtual Key (grafana_noc MCP grant)
#   GITHUB_APP_ID           — the GitHub App id
#   GITHUB_APP_PRIVATE_KEY  — RSA PEM (may contain literal \n; noc.py unescapes)
#   GITHUB_APP_REPO         — owner/repo for the report comment
#
# No secret VALUES live in git — only the references. The VK is issued in the
# Bifrost dashboard and stored in Infisical; the InfisicalSecret only declares
# the mapping.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: aios-noc-secrets-sync
  namespace: ai
  labels:
    app.kubernetes.io/name: aios-noc
    app.kubernetes.io/part-of: aios
spec:
  hostAPI: https://secrets.caehomelab.com/api
  resyncInterval: 60
  authentication:
    universalAuth:
      credentialsRef:
        secretName: jarvis-jatg-universal-auth
        secretNamespace: ai
      secretsScope:
        projectSlug: jarvis-jatg
        envSlug: prod
        secretsPath: /
        recursive: false
  managedKubeSecretReferences:
    - secretName: aios-noc-secrets
      secretNamespace: ai
      secretType: Opaque
      creationPolicy: Owner
      template:
        data:
          BIFROST_VK_AIOS_NOC: '{{ .BIFROST_VK_AIOS_NOC.Value }}'
          GITHUB_APP_ID: '{{ .GITHUB_APP_ID.Value }}'
          GITHUB_APP_PRIVATE_KEY: '{{ .GITHUB_APP_PRIVATE_KEY.Value }}'
          GITHUB_APP_REPO: '{{ .GITHUB_APP_REPO.Value }}'
